<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Tap Study</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0f1014; color: #e9e6df; font: 14px/1.4 system-ui, Segoe UI, sans-serif; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
    #css3d { position: absolute; inset: 0; pointer-events: none; }
    #css3d .eink, #css3d .contact-card { pointer-events: auto; }
    h1 { position: fixed; top: 16px; left: 16px; margin: 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #8b8d96; font-weight: 600; z-index: 2; }
    .ui { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2; }
    button { font: inherit; color: #0f1014; background: #e4cf9f; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; font-weight: 600; transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1), opacity 160ms ease; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: default; }
    button:focus-visible { outline: 2px solid #f2dfb6; outline-offset: 3px; }
    .hint { position: fixed; top: 16px; right: 16px; color: #8b8d96; max-width: 280px; text-align: right; z-index: 2; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <h1>Contact · tap study</h1>
  <p class="hint">Press “Contact me”, or the ✓ key on the wallet.</p>
  <div id="stage"><canvas id="c"></canvas><div id="css3d"></div></div>
  <div class="ui"><button id="tap" type="button">Contact me</button></div>
  <p id="live" class="sr" role="status" aria-live="polite"></p>
  <script type="module" src="/src/lab/contact.ts"></script>
</body>
</html>
