<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wallet Review</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: #0f1014; color: #e9e6df; font: 13px/1.4 system-ui, Segoe UI, sans-serif; }
    canvas { display: block; margin: 0 auto; max-width: 100%; height: auto; }
    .ui { position: fixed; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    button, select { font: inherit; color: #e9e6df; background: #1b1c21; border: 1px solid #3a3c44; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
    #status { position: fixed; top: 10px; left: 12px; color: #8b8d96; }
  </style>
</head>
<body>
  <p id="status">loading…</p>
  <canvas id="c" width="800" height="1000"></canvas>
  <div class="ui">
    <select id="view"></select>
    <select id="bg"><option value="light">light bg (review)</option><option value="dark">dark bg (site)</option></select>
    <button id="capture">Capture all views</button>
  </div>
  <script type="module" src="/src/lab/wallet.ts"></script>
</body>
</html>
