<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sound Audition</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #0f1014; color: #e9e6df; font: 14px/1.45 system-ui, Segoe UI, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 56px 16px 40px; }
    h1 { margin: 0 0 6px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #8b8d96; font-weight: 600; }
    .status { color: #8b8d96; margin: 0 0 10px; }
    ol { list-style: none; margin: 24px 0 0; padding: 0; border-top: 1px solid #2a2c33; }
    li { display: grid; grid-template-columns: minmax(180px, 220px) 1fr; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid #2a2c33; }
    li span { color: #b9b6ae; }
    button { font: 500 13px/1 system-ui, Segoe UI, sans-serif; color: #e4cf9f; background: rgb(228 207 159 / .08); border: 1px solid #4a4436; border-radius: 999px; padding: 10px 14px; cursor: pointer; text-align: left; }
    button:focus-visible { outline: 2px solid #e4cf9f; outline-offset: 3px; }
    @media (max-width: 560px) { li { grid-template-columns: 1fr; gap: 6px; } }
  </style>
</head>
<body>
  <main id="root"><h1>Sound audition</h1></main>
  <script type="module" src="/src/lab/sound.ts"></script>
</body>
</html>
