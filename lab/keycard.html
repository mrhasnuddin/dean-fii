<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Key Card Study</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0f1014; color: #e9e6df; font: 13px/1.4 system-ui, Segoe UI, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    h1 { position: fixed; top: 16px; left: 16px; margin: 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #8b8d96; font-weight: 600; }
    .ui { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 8px; }
    button { font: inherit; color: #e9e6df; background: #1b1c21; border: 1px solid #3a3c44; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
    button[aria-pressed="true"] { border-color: #e4cf9f; color: #e4cf9f; }
  </style>
</head>
<body>
  <h1>Key card study</h1>
  <canvas id="c"></canvas>
  <div class="ui">
    <button id="env" aria-pressed="true">Studio env (site)</button>
    <button id="spin" aria-pressed="true">Auto tilt</button>
  </div>
  <script type="module" src="/src/lab/keycard.ts"></script>
</body>
</html>
